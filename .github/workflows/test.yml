name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # 供 update_questions.yml 在題庫生成後以原生 orchestration 呼叫，
  # 避免依賴 GITHUB_TOKEN push 觸發（該 push 不會再觸發其他 workflow）。
  workflow_call:
    inputs:
      questions_artifact:
        description: >-
          若提供，於測試前將此 artifact 內的 questions.json 覆寫到工作目錄，
          以便驗證尚未 commit 的生成結果。
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run question generator tests
        run: python -m unittest test_generate_questions -v

  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Overlay generated questions.json
        if: inputs.questions_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.questions_artifact }}
          path: .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run frontend logic tests
        run: npm test

      - name: Validate questions.json against frontend schema
        run: |
          node --input-type=module -e "
            import { readFile } from 'node:fs/promises';
            import { isValidQuestionBank } from './js/logic.js';
            const data = JSON.parse(await readFile('questions.json', 'utf8'));
            if (!isValidQuestionBank(data)) {
              console.error('questions.json 未通過前端題庫驗證');
              process.exit(1);
            }
            console.log('questions.json 驗證通過');
          "
