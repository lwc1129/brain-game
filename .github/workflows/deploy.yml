name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 供 update_questions.yml 在 validation 通過並 commit 後直接呼叫部署，
  # 不依賴 GITHUB_TOKEN push 事件（該事件不會觸發後續 workflow）。
  workflow_call:
    inputs:
      ref:
        description: 要部署的 git ref（題庫更新 commit SHA）；空白則使用呼叫方 github.sha
        type: string
        required: false
        default: ''
      skip_tests:
        description: 呼叫方已自行跑過完整測試時設為 true（update_questions.yml 的 validate job）
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 部署閘門：測試沒過就不部署。push / 手動觸發時一律先跑；
  # 只有呼叫方明確傳 skip_tests 才略過（非 workflow_call 時 inputs.skip_tests 為空，視為 false）。
  test:
    if: ${{ !inputs.skip_tests }}
    uses: ./.github/workflows/test.yml

  deploy:
    needs: [test]
    # test 被略過（skipped）時仍要部署，所以不能用預設的 success()。
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_call 時呼叫方可能剛 push 了新 commit；必須 checkout 該 SHA，
          # 否則會部署到觸發更新 workflow 當下的舊樹。
          # 空字串在 Actions 表達式中為 falsy，會回落到 github.sha（push / dispatch）。
          ref: ${{ inputs.ref || github.sha }}

      # 注意：絕不把 GEMINI_API_KEY 注入前端。AI 出題一律經由後端 proxy
      # （見 api/questions.js），這裡只注入 proxy 網址與 GA ID 這類可公開的設定。
      # 未設定時保留 js/config.js 內已提交的預設值。
      - name: Inject runtime config
        env:
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          AI_PROXY_URL: ${{ vars.AI_PROXY_URL }}
        run: |
          set -euo pipefail
          esc() { printf '%s' "$1" | sed 's/[\\|&]/\\&/g'; }
          if [ -n "${GA_MEASUREMENT_ID}" ]; then
            GA_ESC="$(esc "${GA_MEASUREMENT_ID}")"
            sed -i "s|GA_MEASUREMENT_ID: '[^']*'|GA_MEASUREMENT_ID: '${GA_ESC}'|" js/config.js
            grep -q "GA_MEASUREMENT_ID: '${GA_ESC}'" js/config.js
          fi
          if [ -n "${AI_PROXY_URL}" ]; then
            PROXY_ESC="$(esc "${AI_PROXY_URL}")"
            sed -i "s|AI_PROXY_URL: '[^']*'|AI_PROXY_URL: '${PROXY_ESC}'|" js/config.js
            grep -q "AI_PROXY_URL: '${PROXY_ESC}'" js/config.js
          fi

      # 只公開網站執行期需要的檔案（index.html、css、js、assets、questions.json）；
      # 測試、eval、Python 腳本、api/ 不上傳。清單見 scripts/build_site.sh。
      - name: Build site
        run: ./scripts/build_site.sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - uses: actions/deploy-pages@v4
        id: deployment

  # 上線後煙霧測試：實際打正式站的 Pages 與 AI proxy（見 smoke-prod.yml）。
  # 上游 test 可能是 skipped，需明確寫條件，否則本 job 會跟著被略過。
  smoke:
    needs: [deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    uses: ./.github/workflows/smoke-prod.yml
    secrets: inherit
    with:
      # 失敗通知由下方 notify-failure 統一送出，避免同一次失敗通知兩次。
      skip_notify: true

  # Failure-only Slack 通知。成功路徑不執行。
  # notification 本身失敗不會掩蓋原始錯誤（見 notify-slack-failure.yml）。
  notify-failure:
    needs: [test, deploy, smoke]
    if: failure()
    uses: ./.github/workflows/notify-slack-failure.yml
    secrets: inherit
    with:
      # workflow_call 時 github.workflow 會是呼叫端名稱；固定標示本檔部署流程。
      workflow_name: Deploy to GitHub Pages
      result: failure
      branch: ${{ github.ref_name }}
      commit_sha: ${{ inputs.ref || github.sha }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
